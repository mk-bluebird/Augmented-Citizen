[package]
name = "skynet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Privacy-preserving civic identity, consent, and credential-routing core"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"

[dev-dependencies]
kani-verifier = "0.67"
