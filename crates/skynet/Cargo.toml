[package]
name = "skynet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Privacy-preserving civic identity, consent, and credential-routing core"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"

[dev-dependencies]
kani-verifier = "0.67"

[[test]]
name = "identity_reference_proofs"
path = "kani/identity_reference_proofs.rs"
harness = false

[[test]]
name = "consent_scope_proofs"
path = "kani/consent_scope_proofs.rs"
harness = false

[[test]]
name = "audit_minimization_proofs"
path = "kani/audit_minimization_proofs.rs"
harness = false

[[test]]
name = "claim_minimization_proofs"
path = "kani/claim_minimization_proofs.rs"
harness = false

[[test]]
name = "credential_status_proofs"
path = "kani/credential_status_proofs.rs"
harness = false

[[test]]
name = "deployment_policy_proofs"
path = "kani/deployment_policy_proofs.rs"
harness = false
