[workspace]
members = [
    "crates/ac-aln-core",
    "crates/augmented-id-guard",
    "crates/brain-identity-core",
    "crates/city-pass",
    "crates/sovereign-guards-core",
    "crates/skynet",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = [
    "mk-bluebird <host@augmented-citizen.org>",
    "Augmented-Citizen Lab <research@augmented-citizen.org>",
]
homepage = "https://github.com/mk-bluebird/Augmented-Citizen"
repository = "https://github.com/mk-bluebird/Augmented-Citizen"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.38", default-features = true, features = ["serde"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.120"
thiserror = "=1.0.63"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.brainid]
aln_authority = "ALN.MIGRATION.CYBERCORE_AUTHORITY.v1"
host_did = "didalnorganic-host"
bostrom_address = "bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7"

[workspace.metadata.brainid.verification]
kani_verifier_version = "0.67.0"
