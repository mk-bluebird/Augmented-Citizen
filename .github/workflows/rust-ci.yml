name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Run workspace tests
        run: cargo test --workspace --locked

  kani:
    name: Kani
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install Kani
        run: cargo install --locked kani-verifier --version 0.67.0

      - name: Set up Kani
        run: cargo kani setup

      - name: Verify Skynet proof-target registration
        run: |
          test -f crates/skynet/kani/identity_reference_proofs.rs
          test -f crates/skynet/kani/consent_scope_proofs.rs
          test -f crates/skynet/kani/audit_minimization_proofs.rs
          test -f crates/skynet/kani/claim_minimization_proofs.rs
          test -f crates/skynet/kani/credential_status_proofs.rs
          test -f crates/skynet/kani/deployment_policy_proofs.rs

      - name: Verify Skynet identity-reference properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness identity_reference_proofs

      - name: Verify Skynet consent-scope properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness consent_scope_proofs

      - name: Verify Skynet audit-minimization properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness audit_minimization_proofs

      - name: Verify Skynet claim-minimization properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness claim_minimization_proofs

      - name: Verify Skynet credential-status properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness credential_status_proofs

      - name: Verify Skynet deployment-policy properties
        run: >
          cargo kani
          --manifest-path crates/skynet/Cargo.toml
          --harness deployment_policy_proofs
